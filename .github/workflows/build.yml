name: Build ReVanced and Morphe bundles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [revanced, morphe]
    env:
      GIF_BUILD_DIR: build/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py ${{ matrix.platform == 'morphe' && '--morphe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gif-comments-${{ matrix.platform }}
          path: |
            build/${{ matrix.platform }}/*.rvp
            build/${{ matrix.platform }}/*.mpp
            build/${{ matrix.platform }}/SHA256SUMS.txt
